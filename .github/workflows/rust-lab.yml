name: Rust Lab installers
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: experiments/tauri/package-lock.json
      - run: rustup update stable --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            experiments/tauri/src-tauri/target
          key: rust-lab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/tauri/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm test
      - run: npm run build -- --bundles ${{ matrix.bundle }}
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Zalo Native Rust Lab.app" "Rust-Lab-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-Lab-${{ matrix.os }}
          path: |
            experiments/tauri/Rust-Lab-macOS.zip
            experiments/tauri/src-tauri/target/release/bundle/nsis/*.exe
